name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find Android project
        id: find
        shell: bash
        run: |
          set -e

          GRADLEW=$(find . -type f -name gradlew | head -n 1)

          if [ -z "$GRADLEW" ]; then
            echo "No Gradle project found."
            echo "Repository files:"
            find . -maxdepth 3 -type f | sort | head -100
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

          chmod +x "$GRADLEW"

          echo "Found project: $PROJECT_DIR"

      - name: Build Debug APK
        working-directory: ${{ steps.find.outputs.project_dir }}
        run: |
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JungleBookLiveStats-APK
          path: |
            **/build/outputs/apk/**/*.apk
